<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Class — Tank Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            font-family: 'Ubuntu', sans-serif;
            background-image: url("{{ url_for('static', filename='classSelect.png') }}");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
        }

        .title {
            text-align: center;
            font-size: 32px;
            color: slategray;
            font-weight: bold;
            margin-top: 30px;
            margin-bottom: 40px;
        }

        /* Back link — top-left */
        .back-link {
            position: fixed;
            top: 14px;
            left: 14px;
            color: slategray;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Ubuntu', sans-serif;
            z-index: 999;
        }
        .back-link:hover { text-decoration: underline; }

        .parentContainer {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 20px;
        }

        .class-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1100px;
        }

        .class-card {
            width: 220px;
            background-color: lightskyblue;
            color: slategrey;
            border: none;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Ubuntu', sans-serif;
            transition: transform 0.15s, opacity 0.15s;
        }
        .class-card:hover {
            opacity: 0.9;
            transform: translateY(-4px);
        }
        .class-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        .class-card img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .class-card .class-name {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .class-card .class-desc {
            font-size: 13px;
            color: slategrey;
            line-height: 1.4;
        }

        @media (max-width: 768px) {
            .class-grid {
                gap: 14px;
            }
            .class-card {
                width: 160px;
                padding: 14px;
            }
            .class-card img {
                width: 80px;
                height: 80px;
            }
            .class-card .class-name {
                font-size: 17px;
            }
            .class-card .class-desc {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

    <a href="{{ url_for('homePage') }}" class="back-link">← Back to Menu</a>

    <div class="title">
        <h1>Select a Class</h1>
    </div>

    <div class="parentContainer">

        <div class="class-grid">

            <!-- Assault -->
            <a href="{{ url_for('game', tank_class='assault') }}" class="class-card">
                <img src="{{ url_for('static', filename='assault_icon.png') }}" alt="Assault">
                <div class="class-name">Assault</div>
                <div class="class-desc">Fast speed and increased fire rate.</div>
            </a>

            <!-- Medic -->
            <a href="{{ url_for('game', tank_class='medic') }}" class="class-card">
                <img src="{{ url_for('static', filename='medic_icon.png') }}" alt="Medic">
                <div class="class-name">Medic</div>
                <div class="class-desc">Extra HP, regular damage and speed.</div>
            </a>

            <!-- Scout -->
            <a href="{{ url_for('game', tank_class='scout') }}" class="class-card">
                <img src="{{ url_for('static', filename='scout.png') }}" alt="Scout">
                <div class="class-name">Scout</div>
                <div class="class-desc">High damage output but slower fire rate and health.</div>
            </a>

            <!-- Support -->
            <a href="{{ url_for('game', tank_class='support') }}" class="class-card">
                <img src="{{ url_for('static', filename='support_class.png') }}" alt="Support">
                <div class="class-name">Support</div>
                <div class="class-desc">Tankiest class with balanced fire rate but slower movement.</div>
            </a>

        </div>

    </div>

</body>
</html>
