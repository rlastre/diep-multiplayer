<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Select Class — Tank Arena</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: 'Ubuntu', sans-serif;
            background-image: url("{{ url_for('static', filename='classSelect.png') }}");
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 60px 20px 40px;
        }

        .title {
            text-align: center;
            font-size: 32px;
            color: slategray;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* Back link — top-left */
        .back-link {
            position: fixed;
            top: 14px;
            left: 14px;
            color: slategray;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            font-family: 'Ubuntu', sans-serif;
            z-index: 999;
        }
        .back-link:hover { text-decoration: underline; }

        .class-grid {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1100px;
        }

        .class-card {
            width: 230px;
            background-color: lightskyblue;
            color: slategrey;
            border: none;
            padding: 20px 18px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: 'Ubuntu', sans-serif;
            transition: transform 0.15s, opacity 0.15s, box-shadow 0.15s;
        }
        .class-card:hover {
            opacity: 0.95;
            transform: translateY(-4px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }
        .class-card:active {
            transform: translateY(-2px) scale(0.98);
        }

        .class-card img {
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        /* Bold black class name so it stands out */
        .class-card .class-name {
            font-size: 22px;
            font-weight: bold;
            color: #000;
            margin-bottom: 6px;
        }

        .class-card .class-desc {
            font-size: 13px;
            color: #2f4f4f;
            line-height: 1.4;
            min-height: 54px;
            margin-bottom: 14px;
        }

        /* Stat bars */
        .stats {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-top: 12px;
            border-top: 1px solid rgba(47, 79, 79, 0.25);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            font-weight: bold;
            color: #000;
        }

        .stat-label {
            width: 38px;
            text-align: left;
        }

        .stat-bar {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.55);
            border-radius: 4px;
            overflow: hidden;
        }

        .stat-fill {
            height: 100%;
            background: slategrey;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .class-grid { gap: 14px; }
            .class-card {
                width: 170px;
                padding: 14px;
            }
            .class-card img {
                width: 80px;
                height: 80px;
            }
            .class-card .class-name { font-size: 18px; }
            .class-card .class-desc { font-size: 12px; min-height: 70px; }
        }
    </style>
</head>
<body>

    <a href="{{ url_for('homePage') }}" class="back-link">← Back to Menu</a>

    <div class="title">
        <h1>Select a Class</h1>
    </div>

    <div class="class-grid">

        <!-- Assault: HP 100, DMG 10, FIRE 100ms (fastest) -->
        <a href="{{ url_for('game', tank_class='assault') }}" class="class-card">
            <img src="{{ url_for('static', filename='assault_icon.png') }}" alt="Assault">
            <div class="class-name">Assault</div>
            <div class="class-desc">Fast speed and increased fire rate.</div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">HP</span>
                    <div class="stat-bar"><div class="stat-fill" style="width: 40%;"></div></div>
                </div>
                <div class="stat">
                    <span class="stat-label">DMG</span>
                    <div class="stat-bar"><div class="stat-fill" style="width: 20%;"></div></div>
                </div>
                <div class="stat">
                    <span class="stat-label">FIRE</span>
                    <div class="stat-bar"><div class="stat-fill" style="width: 100%;"></div></div>
                </div>
            </div>
        </a>

        <!-- Medic: HP 175, DMG 15, FIRE 400ms -->
        <a href="{{ url_for('game', tank_class='medic') }}" class="class-card">
            <img src="{{ url_for('static', filename='medic_icon.png') }}" alt="Medic">
            <div class="class-name">Medic</div>
            <div class="class-desc">Extra HP, regular damage and speed.</div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">HP</span>
                    <div class="stat-bar"><div class="stat-fill" style="width: 100%;"></div></div>
                </div>
                <div class="stat">
                    <span class="stat-label">DMG</span>
                    <div class="stat-bar"><div class="stat-fill" style="width: 30%;"></div></div>
                </div>
                <div class="stat">
                    <span class="stat-label">FIRE</span>
                    <div class="stat-bar"><div class="stat-fill" style="width: 50%;"></div></div>
                </div>
            </div>
        </a>

        <!-- Scout: HP 70, DMG 45, FIRE 800ms (slowest) -->
        <a href="{{ url_for('game', tank_class='scout') }}" class="class-card">
            <img src="{{ url_for('static', filename='scout.png') }}" alt="Scout">
            <div class="class-name">Scout</div>
            <div class="class-desc">High damage output but slower fire rate and health.</div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">HP</span>
                    <div class="stat-bar"><div class="stat-fill" style="width: 28%;"></div></div>
                </div>
                <div class="stat">
                    <span class="stat-label">DMG</span>
                    <div class="stat-bar"><div class="stat-fill" style="width: 100%;"></div></div>
                </div>
                <div class="stat">
                    <span class="stat-label">FIRE</span>
                    <div class="stat-bar"><div class="stat-fill" style="width: 15%;"></div></div>
                </div>
            </div>
        </a>

        <!-- Support: HP 170, DMG 30, FIRE 280ms -->
        <a href="{{ url_for('game', tank_class='support') }}" class="class-card">
            <img src="{{ url_for('static', filename='support_class.png') }}" alt="Support">
            <div class="class-name">Support</div>
            <div class="class-desc">Tankiest class with balanced fire rate but slower movement.</div>
            <div class="stats">
                <div class="stat">
                    <span class="stat-label">HP</span>
                    <div class="stat-bar"><div class="stat-fill" style="width: 97%;"></div></div>
                </div>
                <div class="stat">
                    <span class="stat-label">DMG</span>
                    <div class="stat-bar"><div class="stat-fill" style="width: 65%;"></div></div>
                </div>
                <div class="stat">
                    <span class="stat-label">FIRE</span>
                    <div class="stat-bar"><div class="stat-fill" style="width: 70%;"></div></div>
                </div>
            </div>
        </a>

    </div>

</body>
</html>
