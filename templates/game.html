<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Multiplayer Tank</title>
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #2b2b2b;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
<script>

// =============================================
//  MULTIPLAYER TANK — Socket.IO + Phaser 3
// =============================================

class PlayScene extends Phaser.Scene {

  constructor() {
    super('PlayScene');
    this.otherPlayers = {};   // remote player sprites keyed by socket id
    this.myId = null;
    this.myColor = '#4488cc';
  }

  preload() {
    // Bullet texture
    const bl = this.make.graphics({ add: false });
    bl.fillStyle(0xffcc00, 1);
    bl.fillCircle(4, 4, 4);
    bl.generateTexture('bullet', 8, 8);

    // Crate texture
    const c = this.make.graphics({ add: false });
    c.fillStyle(0xc2855a, 1);
    c.fillRect(0, 0, 26, 26);
    c.lineStyle(2, 0x8b5e3c, 1);
    c.strokeRect(0, 0, 26, 26);
    c.lineBetween(0, 0, 26, 26);
    c.lineBetween(26, 0, 0, 26);
    c.generateTexture('crate', 26, 26);
  }

  create() {
    this.cameras.main.setBackgroundColor('#e8e4d8');

    // Grid
    const grid = this.add.graphics();
    grid.lineStyle(0.5, 0x000000, 0.07);
    for (let x = 0; x <= 800; x += 40) grid.lineBetween(x, 0, x, 600);
    for (let y = 0; y <= 600; y += 40) grid.lineBetween(0, y, 800, y);

    // Crates (local only for now)
    this.crates = this.physics.add.staticGroup();
    [[150,120],[650,100],[300,450],[550,350],[100,400],
     [700,500],[400,150],[200,280],[600,250]].forEach(([x, y]) => {
      this.crates.create(x, y, 'crate');
    });

    // Bullets group (for ALL bullets — local and remote)
    this.bullets = this.physics.add.group();
    this.physics.add.overlap(this.bullets, this.crates, (bullet, crate) => {
      bullet.destroy();
      crate.destroy();
    });

    // Controls
    this.keys = this.input.keyboard.addKeys({
      w: Phaser.Input.Keyboard.KeyCodes.W,
      a: Phaser.Input.Keyboard.KeyCodes.A,
      s: Phaser.Input.Keyboard.KeyCodes.S,
      d: Phaser.Input.Keyboard.KeyCodes.D,
    });
    this.lastShot = 0;

    // HUD
    this.statusText = this.add.text(14, 14, 'Connecting...', {
      fontFamily: 'Courier New', fontSize: '14px', color: '#333',
    });
    this.add.text(14, 570, 'WASD move · Mouse aim · Click shoot', {
      fontFamily: 'Courier New', fontSize: '13px', color: '#888',
    });

    // =============================================
    //  SOCKET.IO CONNECTION
    // =============================================
    this.socket = io();

    // --- Server tells us our id and all current players ---
    this.socket.on('init', (data) => {
      this.myId = data.id;
      const me = data.players[this.myId];
      this.myColor = me.color;

      // Create local tank at the position server assigned
      this.createLocalTank(me.x, me.y, me.color);

      // Create sprites for players already in the game
      for (const [pid, pdata] of Object.entries(data.players)) {
        if (pid !== this.myId) {
          this.addRemotePlayer(pid, pdata);
        }
      }
      this.updateStatus();
    });

    // --- Another player joined ---
    this.socket.on('player_joined', (data) => {
      this.addRemotePlayer(data.id, data.data);
      this.updateStatus();
    });

    // --- Another player left ---
    this.socket.on('player_left', (data) => {
      this.removeRemotePlayer(data.id);
      this.updateStatus();
    });

    // --- Another player moved ---
    this.socket.on('player_moved', (data) => {
      const remote = this.otherPlayers[data.id];
      if (!remote) return;
      remote.tank.x = data.data.x;
      remote.tank.y = data.data.y;
      remote.barrel.x = data.data.x;
      remote.barrel.y = data.data.y;
      remote.barrel.rotation = data.data.angle;
    });

    // --- Another player shot ---
    this.socket.on('player_shot', (data) => {
      this.spawnBullet(data.data.x, data.data.y, data.data.angle);
    });
  }


  // =============================================
  //  CREATE TANKS
  // =============================================

  createLocalTank(x, y, color) {
    // Tank body texture with the assigned color
    const hexColor = parseInt(color.replace('#', ''), 16);
    const darkerHex = Phaser.Display.Color.ValueToColor(hexColor).darken(20).color;

    const tg = this.make.graphics({ add: false });
    tg.fillStyle(hexColor, 1);
    tg.fillRect(0, 0, 32, 32);
    tg.lineStyle(2, darkerHex, 1);
    tg.strokeRect(0, 0, 32, 32);
    tg.generateTexture('tank_local', 32, 32);

    // Barrel
    const bg = this.make.graphics({ add: false });
    bg.fillStyle(0x777777, 1);
    bg.fillRect(0, 0, 28, 8);
    bg.lineStyle(1, 0x555555, 1);
    bg.strokeRect(0, 0, 28, 8);
    bg.generateTexture('barrel_local', 28, 8);

    this.tank = this.physics.add.image(x, y, 'tank_local');
    this.tank.setCollideWorldBounds(true);
    this.tank.setDrag(400);
    this.tank.setMaxVelocity(180);
    this.tank.setDepth(1);

    this.barrel = this.add.image(x, y, 'barrel_local');
    this.barrel.setOrigin(0, 0.5);
    this.barrel.setDepth(2);
  }

  addRemotePlayer(pid, data) {
    const hexColor = parseInt(data.color.replace('#', ''), 16);
    const darkerHex = Phaser.Display.Color.ValueToColor(hexColor).darken(20).color;

    // Generate unique textures per player
    const tKey = 'tank_' + pid;
    const bKey = 'barrel_' + pid;

    const tg = this.make.graphics({ add: false });
    tg.fillStyle(hexColor, 1);
    tg.fillRect(0, 0, 32, 32);
    tg.lineStyle(2, darkerHex, 1);
    tg.strokeRect(0, 0, 32, 32);
    tg.generateTexture(tKey, 32, 32);

    const bg = this.make.graphics({ add: false });
    bg.fillStyle(0x777777, 1);
    bg.fillRect(0, 0, 28, 8);
    bg.lineStyle(1, 0x555555, 1);
    bg.strokeRect(0, 0, 28, 8);
    bg.generateTexture(bKey, 28, 8);

    const tank = this.add.image(data.x, data.y, tKey);
    tank.setDepth(1);

    const barrel = this.add.image(data.x, data.y, bKey);
    barrel.setOrigin(0, 0.5);
    barrel.setDepth(2);
    barrel.rotation = data.angle || 0;

    this.otherPlayers[pid] = { tank, barrel };
  }

  removeRemotePlayer(pid) {
    const remote = this.otherPlayers[pid];
    if (remote) {
      remote.tank.destroy();
      remote.barrel.destroy();
      delete this.otherPlayers[pid];
    }
  }

  updateStatus() {
    const count = Object.keys(this.otherPlayers).length + 1;
    this.statusText.setText('Players: ' + count);
  }


  // =============================================
  //  BULLETS
  // =============================================

  spawnBullet(x, y, angle) {
    const bullet = this.bullets.create(x, y, 'bullet');
    bullet.setCircle(4);
    bullet.setVelocity(Math.cos(angle) * 400, Math.sin(angle) * 400);
    this.time.delayedCall(1500, () => { if (bullet.active) bullet.destroy(); });
  }


  // =============================================
  //  UPDATE LOOP
  // =============================================

  update(time) {
    // Wait until we have a tank
    if (!this.tank) return;

    // Movement
    const spd = 400;
    let ax = 0, ay = 0;
    if (this.keys.a.isDown) ax = -spd;
    if (this.keys.d.isDown) ax = spd;
    if (this.keys.w.isDown) ay = -spd;
    if (this.keys.s.isDown) ay = spd;
    this.tank.setAcceleration(ax, ay);

    // Barrel aim
    const ptr = this.input.activePointer;
    const angle = Phaser.Math.Angle.Between(
      this.tank.x, this.tank.y, ptr.worldX, ptr.worldY
    );
    this.barrel.rotation = angle;
    this.barrel.x = this.tank.x;
    this.barrel.y = this.tank.y;

    // Send position to server (throttled to ~20 times/sec)
    if (!this.lastSend || time > this.lastSend + 50) {
      this.lastSend = time;
      this.socket.emit('move', {
        x: this.tank.x,
        y: this.tank.y,
        angle: angle,
      });
    }

    // Shoot
    if (ptr.isDown && time > this.lastShot + 250) {
      this.lastShot = time;
      const bx = this.tank.x + Math.cos(angle) * 30;
      const by = this.tank.y + Math.sin(angle) * 30;
      this.spawnBullet(bx, by, angle);
      // Tell server about the shot
      this.socket.emit('shoot', { x: bx, y: by, angle: angle });
    }

    // Cleanup off-screen bullets
    this.bullets.getChildren().forEach(b => {
      if (b.x < -20 || b.x > 820 || b.y < -20 || b.y > 620) b.destroy();
    });
  }
}


const config = {
  type: Phaser.AUTO,
  width: 800,
  height: 600,
  physics: {
    default: 'arcade',
    arcade: { gravity: { y: 0 }, debug: false }
  },
  scene: [PlayScene],
};

new Phaser.Game(config);

</script>
</body>
</html>
