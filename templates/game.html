<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Tank Arena</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    body {
      background: #2b2b2b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    #logout-btn {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #cc4444;
      color: #fff;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      z-index: 999;
    }
  </style>
</head>

<body>
  <button id="logout-btn" onclick="window.location.href='/logout'">Logout</button>
  <script>
    window.PLAYER_NAME = "{{ username }}";
    window.TANK_CLASS = "{{ tank_class }}";
    window.CLASS_STATS = {
      hp: {{ class_stats.hp }},
    maxHp: { { class_stats.max_hp } },
    speed: { { class_stats.speed } },
    bulletDamage: { { class_stats.bullet_damage } },
    fireRate: { { class_stats.fire_rate } },
    bulletSpeed: { { class_stats.bullet_speed } },
  };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="/static/js/game.js"></script>
</body>

</html>
