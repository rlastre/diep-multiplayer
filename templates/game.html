<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tank Arena</title>
<style>
  * { margin: 0; padding: 0; }
  body {
    background: #2b2b2b;
    display: flex; justify-content: center; align-items: center; height: 100vh;
  }
  #logout-btn {
    position: fixed; top: 10px; right: 10px;
    background: #cc4444; color: #fff; border: none;
    padding: 8px 16px; border-radius: 4px;
    font-family: 'Courier New', monospace; cursor: pointer; z-index: 999;
  }
	#chat-box {
		position: fixed; bottom: 5%; left: 15%; max-width: 30%;
		font-family: 'Courier New', monospace; overflow-wrap: break-word;
	}
	#chat-box input {
		font-family: 'Courier New', monospace;
	}
	#chat-box button {
		min-width: 2em;
	}
	#chat-log {
		pointer-events: none;
	}
	.text-message {
		background: rgba(210, 210, 210, 0.3);
	}
	#chat-visibility {
		visibility: visible;
	}
	.visibility-hidden {
		visibility: hidden;
	}
	.chat-input-container {
		display: flex; align-items: center;
	}
</style>
</head>
<body>
<button id="logout-btn" onclick="window.location.href='/logout'">Logout</button>
<div id="chat-box">
	<div id="chat-log">
	</div>
	<span id="chat-input-container">
		<button id="chat-visibility">👁&#xFE0E;</button>
		<input id="message-input" type="text" maxlength="40" />
		<button id="message-send">⏎</button>
	</span>
</div>
<script>window.PLAYER_NAME = "{{ username }}";</script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script src="/static/js/game.js"></script>
</body>
</html>
